<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${seccion + ' · HerramientasD'}">Operaciones · HerramientasD</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><a class="skip-link" href="#contenido">Ir al contenido</a><th:block th:replace="~{fragments/navegacion :: cabecera(${seccion})}"/><main id="contenido" class="workspace"><header class="page-heading"><div><p class="eyebrow">HerramientasD / Operaciones</p><h1 th:text="${seccion == 'panel' ? 'La operación empieza aquí.' : (seccion == 'productos' ? 'Tu catálogo, a la vista.' : (seccion == 'usuarios' ? 'El equipo del sistema.' : (seccion == 'paquetes' ? 'Historial de paquetes' : (seccion == 'movimientos' ? 'Movimientos de stock' : (seccion == 'auditoria' ? 'Auditoría de operaciones' : (seccion == 'cuenta' ? 'Mi cuenta' : (seccion == 'qr' ? 'Consulta de códigos QR' : 'Preparar un pedido')))))))}"></h1><p>Consulta y administra tu operación.</p></div><a class="text-link" th:href="@{/}">Inicio</a></header><p th:if="${errorOperacion != null}" th:text="${errorOperacion}" class="message message-error" role="alert"></p><p th:if="${exitoOperacion != null}" th:text="${exitoOperacion}" class="message message-success" role="status"></p><section class="panel"><th:block th:if="${seccion == 'panel'}"><th:block th:replace="~{fragments/operaciones/panel :: contenido}"/></th:block><th:block th:if="${seccion == 'productos'}"><th:block th:replace="~{fragments/operaciones/productos :: contenido}"/></th:block><th:block th:if="${seccion == 'usuarios'}"><th:block th:replace="~{fragments/operaciones/usuarios :: contenido}"/></th:block><th:block th:if="${seccion == 'paquetes'}"><th:block th:replace="~{fragments/operaciones/paquetes :: contenido}"/></th:block><th:block th:if="${seccion == 'movimientos'}"><th:block th:replace="~{fragments/operaciones/movimientos :: contenido}"/></th:block><th:block th:if="${seccion == 'auditoria'}"><th:block th:replace="~{fragments/operaciones/auditoria :: contenido}"/></th:block><th:block th:if="${seccion == 'cuenta'}"><th:block th:replace="~{fragments/operaciones/cuenta :: contenido}"/></th:block><th:block th:if="${seccion == 'empaquetador'}"><th:block th:replace="~{fragments/operaciones/empaquetador :: contenido}"/></th:block><th:block th:if="${seccion == 'qr'}"><th:block th:replace="~{fragments/operaciones/qr :: contenido}"/></th:block><th:block th:if="${paginaDatos != null}"><p th:text="${paginaDatos.totalElementos + ' resultados'}" class="field-help"></p><div th:if="${#lists.isEmpty(paginaDatos.contenido)}" class="empty-state"><h2>No hay resultados</h2><p>Cambia los filtros o registra tu primera operación.</p></div><nav class="ops-pagination" aria-label="Paginación"><a class="button button-secondary" th:if="${paginaDatos.pagina > 0}" th:href="${anterior}">Anterior</a><span th:text="${'Página ' + (paginaDatos.totalPaginas == 0 ? 0 : paginaDatos.pagina + 1) + ' de ' + paginaDatos.totalPaginas}"></span><a class="button button-secondary" th:unless="${paginaDatos.ultima}" th:href="${siguiente}">Siguiente</a></nav></th:block></section></main><footer class="site-footer"><span>HerramientasD</span><span>Uso interno</span></footer></body></html>
