<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <style>
        body { font-family: sans-serif; background: #f2f4f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); width: 300px; }
        h2 { margin-top: 0; text-align: center; }
        input { width: 100%; padding: .6rem; margin: .4rem 0 1rem; box-sizing: border-box; }
        button { width: 100%; padding: .7rem; background: #2563eb; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
        .msg { padding: .5rem; margin-bottom: 1rem; border-radius: 4px; font-size: .9rem; }
        .error { background: #fee2e2; color: #991b1b; }
        .ok { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
<form th:action="@{/login}" method="post">
    <h2>Iniciar sesión</h2>
    <div class="msg error" th:if="${param.error}">DNI o contraseña incorrectos</div>
    <div class="msg ok" th:if="${param.logout}">Sesión cerrada correctamente</div>

    <label for="dni">DNI</label>
    <input type="text" id="dni" name="dni" required autofocus>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Ingresar</button>
</form>
</body>
</html>
