<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="cabecera(vista)">
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="icon-catalogo" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
        <symbol id="icon-caja" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v10l-9 4-9-4Z M3 7l9 4 9-4 M12 11v10 M7 5l9 4"/></symbol>
        <symbol id="icon-movimientos" viewBox="0 0 24 24"><path d="M4 7h16m-4-4 4 4-4 4 M20 17H4m4-4-4 4 4 4"/></symbol>
        <symbol id="icon-usuarios" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3 M17 4a3 3 0 0 1 0 6 M18 14a5 5 0 0 1 3 4v3"/></symbol>
        <symbol id="icon-buscar" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
        <symbol id="icon-prenda" viewBox="0 0 24 24"><path d="m8 3-6 4 3 5 3-2v11h8V10l3 2 3-5-6-4a4 4 0 0 1-8 0Z"/></symbol>
        <symbol id="icon-alerta" viewBox="0 0 24 24"><path d="m12 3 10 18H2Z M12 9v5 M12 17v1"/></symbol>
    </svg>
    <header class="site-header workspace-header">
        <a class="brand" th:href="@{/}">HerramientasD<span class="brand-caption">Gestión interna</span></a>
        <nav class="workspace-nav" aria-label="Navegación principal">
            <a th:href="@{/}" th:attr="aria-current=${vista == 'inicio' or vista == 'administrador' ? 'page' : null}">Inicio</a>
            <a th:href="@{/(vista='inventario')}" th:attr="aria-current=${vista == 'inventario' ? 'page' : null}" sec:authorize="isAuthenticated()">Inventario</a>
            <a th:href="@{/(vista='registro')}" th:attr="aria-current=${vista == 'registro' ? 'page' : null}">Registro</a>
            <a th:href="@{/(vista='cuenta')}" th:attr="aria-current=${vista == 'cuenta' ? 'page' : null}" sec:authorize="isAuthenticated()">Mi cuenta</a>
        </nav>
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
            <button class="button button-secondary" type="submit">Cerrar sesión</button>
        </form>
        <a class="button button-primary" th:href="@{/login}" sec:authorize="isAnonymous()">Iniciar sesión</a>
    </header>
</th:block>
</body>
</html>
