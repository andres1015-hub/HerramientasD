<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><section th:fragment="contenido"><p>Indica las cantidades de los artículos que deseas incluir. Usa cero para omitir un producto. El sistema valida el stock y calcula el total al crear el pedido.</p><form method="get" th:action="@{/operaciones/empaquetador}" class="ops-filters"><div class="field"><label for="buscar-articulo">Filtrar artículos por nombre</label><input id="buscar-articulo" name="nombre" th:value="${filtro.nombre}"></div><button class="button button-secondary" type="submit">Buscar artículos</button></form><form method="post" th:action="@{/operaciones/empaquetador}" class="ops-form"><div class="field"><label for="numeroPedido-form1">Número de pedido</label><input id="numeroPedido-form1" name="numeroPedido" type="text" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,49}" maxlength="50"></div><div class="table-scroll" role="region" aria-label="Resultados" tabindex="0"><table class="ops-table" role="table"><thead><tr><th scope="col">Producto</th><th scope="col">Stock</th><th scope="col">Precio</th><th scope="col">Cantidad</th></tr></thead><tbody><tr th:each="p,i : ${productos}"><td data-label="Producto" th:text="${p.nombre}"></td><td data-label="Stock" th:text="${p.stock}"></td><td data-label="Precio" th:text="${'S/ ' + #numbers.formatDecimal(p.precio,1,2)}"></td><td data-label="Cantidad"><input type="hidden" th:name="${'lineas[' + i.index + '].idProducto'}" th:value="${p.idProducto}"><label th:for="${'cantidad-' + p.idProducto}" th:text="${'Unidades de ' + p.nombre}"></label><input type="number" min="0" th:max="${p.stock}" value="0" th:name="${'lineas[' + i.index + '].cantidad'}" th:id="${'cantidad-' + p.idProducto}"></td></tr></tbody></table></div><button class="button button-primary" type="submit">Crear pedido</button></form><a class="button button-secondary" th:href="@{/operaciones/paquetes}">Historial de paquetes</a></section></body></html>
