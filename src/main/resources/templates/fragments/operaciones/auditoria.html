<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><section th:fragment="contenido"><form method="get" th:action="@{/operaciones/auditoria}" class="ops-filters"><div class="field"><label for="accion-form1">Acción</label><input id="accion-form1" name="accion" type="text" th:value="${filtro.accion}" ></div><div class="field"><label for="entidad-form1">Entidad</label><input id="entidad-form1" name="entidad" type="text" th:value="${filtro.entidad}" ></div><div class="field"><label for="usuario-form1">DNI del usuario</label><input id="usuario-form1" name="usuario" type="text" th:value="${filtro.usuario}" ></div><div class="field"><label for="desde-form1">Desde</label><input id="desde-form1" name="desde" type="date" th:value="${filtro.desde}" ></div><div class="field"><label for="hasta-form1">Hasta</label><input id="hasta-form1" name="hasta" type="date" th:value="${filtro.hasta}" ></div><button class="button button-primary" type="submit">Aplicar filtros</button><a class="button button-secondary" th:href="@{/operaciones/auditoria}">Limpiar</a></form><div class="table-scroll" role="region" aria-label="Resultados" tabindex="0"><table class="ops-table" role="table"><thead><tr><th scope="col">Fecha</th><th scope="col">Usuario</th><th scope="col">Acción</th><th scope="col">Entidad</th><th scope="col">ID</th><th scope="col">Detalle</th></tr></thead><tbody><tr th:each="r : ${paginaDatos.contenido}"><td data-label="Fecha" th:text="${#temporals.format(r.fecha,'dd/MM/yyyy HH:mm')}"></td><td data-label="Usuario" th:text="${r.usuarioDni}"></td><td data-label="Acción" th:text="${r.accion}"></td><td data-label="Entidad" th:text="${r.entidad}"></td><td data-label="ID" th:text="${r.entidadId}"></td><td data-label="Detalle" th:text="${r.detalle}"></td></tr></tbody></table></div></section></body></html>
