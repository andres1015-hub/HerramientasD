<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><section th:fragment="contenido"><form method="get" th:action="@{/operaciones/paquetes}" class="ops-filters"><div class="field"><label for="pedido-form1">Número de pedido</label><input id="pedido-form1" name="pedido" type="text" th:value="${filtro.pedido}" ></div><div class="field"><label for="estado-form1">Estado</label><select id="estado-form1" name="estado"><option value="" th:selected="${filtro.estado == ''}">Todos</option><option value="Enviado" th:selected="${filtro.estado == 'Enviado'}">Enviado</option><option value="Recibido" th:selected="${filtro.estado == 'Recibido'}">Recibido</option><option value="Cancelado" th:selected="${filtro.estado == 'Cancelado'}">Cancelado</option></select></div><div class="field"><label for="desde-form1">Desde</label><input id="desde-form1" name="desde" type="date" th:value="${filtro.desde}" ></div><div class="field"><label for="hasta-form1">Hasta</label><input id="hasta-form1" name="hasta" type="date" th:value="${filtro.hasta}" ></div><button class="button button-primary" type="submit">Aplicar filtros</button><a class="button button-secondary" th:href="@{/operaciones/paquetes}">Limpiar</a></form><div sec:authorize="hasRole('ADMINISTRADOR')"><a class="button button-secondary" th:href="@{/operaciones/exportar/paquetes.csv(estado=${filtro.estado},pedido=${filtro.pedido},idProducto=${filtro.idProducto},tipo=${filtro.tipo},desde=${filtro.desde},hasta=${filtro.hasta})}">Exportar CSV</a></div><div class="table-scroll" role="region" aria-label="Resultados" tabindex="0"><table class="ops-table" role="table"><thead><tr><th scope="col">Pedido</th><th scope="col">Fecha</th><th scope="col">Persona</th><th scope="col">Unidades</th><th scope="col">Total</th><th scope="col">Estado</th><th scope="col">Detalle</th></tr></thead><tbody><tr th:each="p : ${paginaDatos.contenido}"><td data-label="Pedido" th:text="${p.nPedido}"></td><td data-label="Fecha" th:text="${p.fechaCreacion != null ? #temporals.format(p.fechaCreacion,'dd/MM/yyyy HH:mm') : '—'}"></td><td data-label="Persona" th:text="${p.nombreUsuario + ' ' + p.apellidoUsuario}"></td><td data-label="Unidades" th:text="${p.totalUnidades}"></td><td data-label="Total" th:text="${'S/ ' + #numbers.formatDecimal(p.total,1,2)}"></td><td data-label="Estado" th:text="${p.estado}"></td><td data-label="Detalle"><a class="button button-secondary" th:href="@{/operaciones/paquetes(detalle=${p.idPaquete})}">Detalle</a></td></tr></tbody></table></div><section class="section-block" th:if="${pedidoDetalle != null}"><h2 th:text="${'Pedido ' + pedidoDetalle.nPedido}"></h2><p th:text="${'Estado: ' + pedidoDetalle.estado}"></p><p th:if="${pedidoDetalle.motivoCancelacion != null}" th:text="${pedidoDetalle.motivoCancelacion}"></p><div class="table-scroll" role="region" aria-label="Resultados" tabindex="0"><table class="ops-table" role="table"><thead><tr><th scope="col">Artículo</th><th scope="col">Cantidad</th><th scope="col">Precio</th><th scope="col">QR</th></tr></thead><tbody><tr th:each="d : ${pedidoDetalle.detalles}"><td data-label="Artículo" th:text="${d.nombreProducto}"></td><td data-label="Cantidad" th:text="${d.cantidad}"></td><td data-label="Precio" th:text="${'S/ ' + #numbers.formatDecimal(d.precioUnitario,1,2)}"></td><td><a class="button button-secondary" th:href="@{/paquete/qr/{id}(id=${d.idDetalles})}">Ver QR</a></td></tr></tbody></table></div><div class="management-grid section-block" th:if="${pedidoDetalle.estado == 'Enviado'}"><section class="panel"><h3>Marcar recibido</h3><p>El cambio es definitivo.</p><form method="post" th:action="@{/operaciones/paquetes/{id}/estado(id=${pedidoDetalle.idPaquete})}" class="ops-form"><input type="hidden" name="estado" value="Recibido"><label class="confirmation"><input type="checkbox" name="confirmado" value="true" required> Confirmo esta operación</label><button class="button button-primary" type="submit">Marcar recibido</button></form></section><section class="panel"><h3>Cancelar pedido</h3><p>El servidor devuelve las existencias. Esta acción es definitiva.</p><form method="post" th:action="@{/operaciones/paquetes/{id}/estado(id=${pedidoDetalle.idPaquete})}" class="ops-form"><input type="hidden" name="estado" value="Cancelado"><div class="field"><label for="motivo-form3">Motivo de cancelación</label><input id="motivo-form3" name="motivo" type="text" required minlength="3" maxlength="255"></div><label class="confirmation"><input type="checkbox" name="confirmado" value="true" required> Confirmo esta operación</label><button class="button button-primary" type="submit">Cancelar pedido</button></form></section></div></section></section></body></html>
