<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><section th:fragment="contenido"><div class="ops-kpis"><article class="panel"><p class="eyebrow">Productos activos</p><p class="ops-value" th:text="${resumen.productosActivos}"></p></article><article class="panel"><p class="eyebrow">Inactivos</p><p class="ops-value" th:text="${resumen.productosInactivos}"></p></article><article class="panel"><p class="eyebrow">Agotados</p><p class="ops-value" th:text="${resumen.productosSinStock}"></p></article><article class="panel"><p class="eyebrow">Stock bajo</p><p class="ops-value" th:text="${resumen.productosStockBajo}"></p></article><article class="panel"><p class="eyebrow">Unidades disponibles</p><p class="ops-value" th:text="${resumen.unidadesEnStock}"></p></article><article class="panel"><p class="eyebrow">Valor del inventario</p><p class="ops-value" th:text="${'S/ ' + #numbers.formatDecimal(resumen.valorInventario,1,2)}"></p></article><article class="panel"><p class="eyebrow">Monto de paquetes no cancelados</p><p class="ops-value" th:text="${'S/ ' + #numbers.formatDecimal(resumen.montoPaquetesNoCancelados,1,2)}"></p></article></div><div class="ops-summary-grid"><section class="panel"><h2>Usuarios por estado</h2><dl class="ops-breakdown"><th:block th:each="entry : ${resumen.usuariosPorEstado}"><dt th:text="${entry.key}"></dt><dd th:text="${entry.value}"></dd></th:block></dl></section><section class="panel"><h2>Paquetes por estado</h2><dl class="ops-breakdown"><th:block th:each="entry : ${resumen.paquetesPorEstado}"><dt th:text="${entry.key}"></dt><dd th:text="${entry.value}"></dd></th:block></dl></section><section class="panel"><h2>Productos destacados</h2><div class="table-scroll" role="region" aria-label="Resultados" tabindex="0"><table class="ops-table" role="table"><thead><tr><th scope="col">Producto</th><th scope="col">Unidades</th></tr></thead><tbody><tr th:each="r : ${resumen.topProductos}"><td data-label="Producto" th:text="${r.nombre}"></td><td data-label="Unidades" th:text="${r.unidades}"></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(resumen.topProductos)}">Aún no hay productos destacados.</p></section></div><a class="button button-secondary" th:href="@{/operaciones/exportar/productos.csv}">Exportar productos CSV</a></section></body></html>
