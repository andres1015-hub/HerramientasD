<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><section th:fragment="contenido"><div class="management-grid"><section class="panel"><h2>Consultar código</h2><form method="get" th:action="@{/operaciones/qr}" class="ops-filters"><div class="field"><label for="codigo-form1">Código QR o enlace completo</label><input id="codigo-form1" name="codigo" type="text" required maxlength="1000"></div><button class="button button-primary" type="submit">Aplicar filtros</button><a class="button button-secondary" th:href="@{/operaciones/qr}">Limpiar</a></form></section><section class="panel"><h2>Leer una imagen</h2><p>Toma una foto con el selector del teléfono o carga una imagen. Consulta el detalle del artículo desde su código.</p><form method="post" enctype="multipart/form-data" th:action="@{/operaciones/qr/imagen}" class="ops-form"><label for="imagen-form2">Foto del QR (PNG/JPEG, máximo 5 MB y 16 megapíxeles)</label><input id="imagen-form2" name="imagen" type="file" accept="image/png,image/jpeg" capture="environment" required><button class="button button-primary" type="submit">Leer QR</button></form></section></div><section class="panel section-block" th:if="${qrDetalle != null}"><h2>Resultado de la consulta</h2><dl class="ops-breakdown"><dt>Pedido</dt><dd th:text="${qrDetalle.nPedido}"></dd><dt>Artículo</dt><dd th:text="${qrDetalle.nombreProducto}"></dd><dt>Cantidad</dt><dd th:text="${qrDetalle.cantidad}"></dd><dt>Estado</dt><dd th:text="${qrDetalle.estadoPaquete}"></dd></dl><a class="button button-secondary" th:href="@{/operaciones/paquetes(detalle=${qrDetalle.idPaquete})}">Ver paquete</a></section></section></body></html>
