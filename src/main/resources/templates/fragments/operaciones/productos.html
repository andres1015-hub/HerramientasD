<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><section th:fragment="contenido"><div class="section-heading"><h2>Catálogo de productos</h2><a href="#gestion-producto" sec:authorize="hasRole('ADMINISTRADOR')" class="button button-primary">Agregar producto</a></div><form method="get" th:action="@{/operaciones/productos}" class="ops-filters"><div class="field"><label for="nombre-form1">Buscar por nombre</label><input id="nombre-form1" name="nombre" type="text" th:value="${filtro.nombre}" ></div><div class="field"><label for="tipo-form1">Tipo</label><select id="tipo-form1" name="tipo"><option value="">Todos</option><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}" th:selected="${t == filtro.tipo}"></option></select></div><div sec:authorize="hasRole('ADMINISTRADOR')"><div class="field"><label for="activo-form1">Disponibilidad</label><select id="activo-form1" name="activo"><option value="">Todos</option><option value="true" th:selected="${filtro.activo == true}">Activos</option><option value="false" th:selected="${filtro.activo == false}">Inactivos</option></select></div></div><label><input type="checkbox" name="stockBajo" value="true" th:checked="${filtro.stockBajo}"> Bajo el mínimo</label><button class="button button-primary" type="submit">Aplicar filtros</button><a class="button button-secondary" th:href="@{/operaciones/productos}">Limpiar</a></form><p class="message message-success" sec:authorize="hasRole('ADMINISTRADOR')" th:text="${alertas + ' productos requieren reposición según su mínimo'}"></p><div class="ops-product-grid"><article class="panel ops-product" th:each="p : ${paginaDatos.contenido}"><p class="eyebrow" th:text="${'ART. ' + p.idProducto + ' / ' + p.tipo}"></p><h3 th:text="${p.nombre}"></h3><p class="ops-price" th:text="${'S/ ' + #numbers.formatDecimal(p.precio,1,2)}"></p><span class="status-badge" th:text="${p.activo ? 'Activo' : 'Inactivo'}"></span><p th:text="${p.stock + ' disponibles · Mínimo ' + p.stockMinimo}"></p><strong th:if="${p.stock &lt;= p.stockMinimo}">Reponer existencias</strong><div class="ops-actions" sec:authorize="hasRole('ADMINISTRADOR')"><a class="button button-secondary" th:href="@{/operaciones/productos(editar=${p.idProducto})}">Editar / existencias</a><a class="button button-secondary" th:href="@{/operaciones/movimientos(idProducto=${p.idProducto})}">Historial</a></div></article></div><section id="gestion-producto" sec:authorize="hasRole('ADMINISTRADOR')" class="section-block"><h2 th:text="${edicion != null ? 'Editar producto' : 'Agregar producto'}"></h2><p class="field-help">El stock se modifica únicamente con movimientos.</p><form method="post" th:action="${edicion != null ? '/operaciones/productos/' + edicion.idProducto + '/editar' : '/operaciones/productos/crear'}" class="ops-form"><div class="field"><label for="nombre-form2">Nombre</label><input id="nombre-form2" name="nombre" type="text" th:value="${edicion != null ? edicion.nombre : ''}" required maxlength="50"></div><div class="field"><label for="tipo-form2">Tipo</label><input id="tipo-form2" name="tipo" type="text" th:value="${edicion != null ? edicion.tipo : ''}" required maxlength="30"></div><div class="field"><label for="precio-form2">Precio (S/)</label><input id="precio-form2" name="precio" type="number" th:value="${edicion != null ? edicion.precio : ''}" required min="0.01" step="0.01"></div><div class="field"><label for="stockMinimo-form2">Stock mínimo</label><input id="stockMinimo-form2" name="stockMinimo" type="number" th:value="${edicion != null ? edicion.stockMinimo : 5}" required min="0" max="1000000" step="1"></div><div th:if="${edicion == null}"><div class="field"><label for="stock-form2">Stock inicial</label><input id="stock-form2" name="stock" type="number" value="0" min="0" required></div></div><button class="button button-primary" type="submit">Guardar</button></form><div th:if="${edicion != null}" class="section-block management-grid"><section class="panel"><h3>Registrar movimiento</h3><form method="post" th:action="@{/operaciones/productos/{id}/movimiento(id=${edicion.idProducto})}" class="ops-form"><div class="field"><label for="operacion-form3">Movimiento</label><select id="operacion-form3" name="operacion"><option value="ENTRADA">Entrada</option><option value="SALIDA">Salida</option><option value="AJUSTE">Ajuste</option></select></div><div class="field"><label for="cantidad-form3">Cantidad / stock final</label><input id="cantidad-form3" name="cantidad" type="number" min="0" max="1000000" required></div><p class="field-help">Entrada/salida: unidades mayores a cero. Ajuste: valor final del stock.</p><button class="button button-primary" type="submit">Registrar movimiento</button></form></section><section class="panel"><h3>Disponibilidad</h3><p th:text="${edicion.activo ? 'Desactivar conserva el historial del producto.' : 'Activar permite usar el producto nuevamente.'}"></p><form method="post" th:action="@{/operaciones/productos/{id}/activo(id=${edicion.idProducto})}" class="ops-form"><input type="hidden" name="activo" th:value="${!edicion.activo}"><label class="confirmation"><input type="checkbox" name="confirmado" value="true" required> Confirmo esta operación</label><button class="button button-primary" type="submit">Confirmar cambio</button></form></section></div></section></section></body></html>
