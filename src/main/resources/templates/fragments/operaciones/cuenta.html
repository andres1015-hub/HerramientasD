<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><section th:fragment="contenido"><div class="management-grid"><section class="panel"><h2>Datos personales</h2><p th:text="${'DNI: ' + perfil.dni + ' · Rol: ' + perfil.rol + ' (solo lectura)'}"></p><form method="post" th:action="@{/operaciones/cuenta}" class="ops-form"><div class="field"><label for="nombre-form1">Nombre</label><input id="nombre-form1" name="nombre" type="text" th:value="${perfil.nombre}" required maxlength="30"></div><div class="field"><label for="apellido-form1">Apellido</label><input id="apellido-form1" name="apellido" type="text" th:value="${perfil.apellido}" required maxlength="30"></div><button class="button button-primary" type="submit">Guardar</button></form></section><section class="panel"><h2>Cambiar contraseña</h2><p class="message" th:if="${errorCuenta != null}" th:text="${errorCuenta}"></p><p class="message message-success" th:if="${exitoCuenta != null}" th:text="${exitoCuenta}"></p><form method="post" th:action="@{/miperfil/password}" class="ops-form"><div class="field"><label for="passwordActual-form2">Contraseña actual</label><input id="passwordActual-form2" name="passwordActual" type="password" required autocomplete="current-password"></div><div class="field"><label for="passwordNueva-form2">Nueva contraseña</label><input id="passwordNueva-form2" name="passwordNueva" type="password" required minlength="8" maxlength="100" autocomplete="new-password"></div><div class="field"><label for="passwordConfirmacion-form2">Repetir nueva contraseña</label><input id="passwordConfirmacion-form2" name="passwordConfirmacion" type="password" required minlength="8" maxlength="100" autocomplete="new-password"></div><button class="button button-primary" type="submit">Actualizar contraseña</button></form></section></div></section></body></html>
