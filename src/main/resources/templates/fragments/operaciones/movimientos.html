<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><section th:fragment="contenido"><form method="get" th:action="@{/operaciones/movimientos}" class="ops-filters"><div class="field"><label for="idProducto-form1">ID del producto</label><input id="idProducto-form1" name="idProducto" type="number" th:value="${filtro.idProducto}" min="1"></div><div class="field"><label for="tipo-form1">Movimiento</label><select id="tipo-form1" name="tipo"><option value="" th:selected="${filtro.tipo == ''}">Todos</option><option value="INICIAL" th:selected="${filtro.tipo == 'INICIAL'}">INICIAL</option><option value="ENTRADA" th:selected="${filtro.tipo == 'ENTRADA'}">ENTRADA</option><option value="SALIDA" th:selected="${filtro.tipo == 'SALIDA'}">SALIDA</option><option value="AJUSTE" th:selected="${filtro.tipo == 'AJUSTE'}">AJUSTE</option><option value="PAQUETE" th:selected="${filtro.tipo == 'PAQUETE'}">PAQUETE</option><option value="DEVOLUCION" th:selected="${filtro.tipo == 'DEVOLUCION'}">DEVOLUCION</option></select></div><div class="field"><label for="desde-form1">Desde</label><input id="desde-form1" name="desde" type="date" th:value="${filtro.desde}" ></div><div class="field"><label for="hasta-form1">Hasta</label><input id="hasta-form1" name="hasta" type="date" th:value="${filtro.hasta}" ></div><button class="button button-primary" type="submit">Aplicar filtros</button><a class="button button-secondary" th:href="@{/operaciones/movimientos}">Limpiar</a></form><a class="button button-secondary" th:href="@{/operaciones/exportar/movimientos.csv(estado=${filtro.estado},pedido=${filtro.pedido},idProducto=${filtro.idProducto},tipo=${filtro.tipo},desde=${filtro.desde},hasta=${filtro.hasta})}">Exportar CSV</a><div class="table-scroll" role="region" aria-label="Resultados" tabindex="0"><table class="ops-table" role="table"><thead><tr><th scope="col">Producto</th><th scope="col">Tipo</th><th scope="col">Cantidad</th><th scope="col">Anterior</th><th scope="col">Nuevo</th><th scope="col">Referencia</th><th scope="col">Usuario</th><th scope="col">Fecha</th></tr></thead><tbody><tr th:each="r : ${paginaDatos.contenido}"><td data-label="Producto" th:text="${r.nombreProducto}"></td><td data-label="Tipo" th:text="${r.tipo}"></td><td data-label="Cantidad" th:text="${r.cantidad}"></td><td data-label="Anterior" th:text="${r.stockAnterior}"></td><td data-label="Nuevo" th:text="${r.stockNuevo}"></td><td data-label="Referencia" th:text="${r.referencia}"></td><td data-label="Usuario" th:text="${r.usuarioDni}"></td><td data-label="Fecha" th:text="${#temporals.format(r.fecha,'dd/MM/yyyy HH:mm')}"></td></tr></tbody></table></div></section></body></html>
