<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><section th:fragment="contenido"><form method="get" th:action="@{/operaciones/usuarios}" class="ops-filters"><div class="field"><label for="busqueda-form1">Nombre, apellido o DNI</label><input id="busqueda-form1" name="busqueda" type="text" th:value="${filtro.busqueda}" ></div><div class="field"><label for="rol-form1">Rol</label><select id="rol-form1" name="rol"><option value="" th:selected="${filtro.rol == ''}">Todos</option><option value="USER" th:selected="${filtro.rol == 'USER'}">Usuario</option><option value="PROVEEDOR" th:selected="${filtro.rol == 'PROVEEDOR'}">Proveedor</option><option value="ADMINISTRADOR" th:selected="${filtro.rol == 'ADMINISTRADOR'}">Administrador</option></select></div><div class="field"><label for="estado-form1">Estado</label><select id="estado-form1" name="estado"><option value="" th:selected="${filtro.estado == ''}">Todos</option><option value="ACTIVO" th:selected="${filtro.estado == 'ACTIVO'}">ACTIVO</option><option value="INNACTIVO" th:selected="${filtro.estado == 'INNACTIVO'}">INNACTIVO</option><option value="ELIMINADO" th:selected="${filtro.estado == 'ELIMINADO'}">ELIMINADO</option></select></div><button class="button button-primary" type="submit">Aplicar filtros</button><a class="button button-secondary" th:href="@{/operaciones/usuarios}">Limpiar</a></form><div class="table-scroll" role="region" aria-label="Resultados" tabindex="0"><table class="ops-table" role="table"><thead><tr><th scope="col">Persona</th><th scope="col">DNI</th><th scope="col">Rol</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="u : ${paginaDatos.contenido}"><td data-label="Persona" th:text="${u.nombre + ' ' + u.apellido}"></td><td data-label="DNI" th:text="${u.dni}"></td><td data-label="Rol" th:text="${u.rol}"></td><td data-label="Estado" th:text="${u.estado}"></td><td data-label="Acciones"><a class="text-link" th:if="${u.estado != 'ELIMINADO'}" th:href="@{/operaciones/usuarios(editar=${u.idUsuario})}">Administrar</a></td></tr></tbody></table></div><section id="gestion-usuario" class="section-block"><h2 th:text="${edicion != null ? 'Editar usuario' : 'Registrar usuario'}"></h2><form method="post" th:action="${edicion != null ? '/operaciones/usuarios/' + edicion.idUsuario + '/editar' : '/operaciones/usuarios/crear'}" class="ops-form"><div class="field"><label for="nombre-form2">Nombre</label><input id="nombre-form2" name="nombre" type="text" th:value="${edicion != null ? edicion.nombre : ''}" required maxlength="30"></div><div class="field"><label for="apellido-form2">Apellido</label><input id="apellido-form2" name="apellido" type="text" th:value="${edicion != null ? edicion.apellido : ''}" required maxlength="30"></div><div class="field"><label for="rol-form2">Rol asignado</label><select id="rol-form2" name="rol"><option value="USER" th:selected="${edicion == null or edicion.rol == 'USER'}">Usuario</option><option value="PROVEEDOR" th:selected="${edicion != null and edicion.rol == 'PROVEEDOR'}">Proveedor</option><option value="ADMINISTRADOR" th:selected="${edicion != null and edicion.rol == 'ADMINISTRADOR'}">Administrador</option></select></div><div th:if="${edicion == null}"><div class="field"><label for="dni-form2">DNI</label><input id="dni-form2" name="dni" type="text" required pattern="[0-9]{8}" maxlength="8"></div><div class="field"><label for="password-form2">Contraseña inicial</label><input id="password-form2" name="password" type="password" required minlength="8" maxlength="100" autocomplete="new-password"></div></div><button class="button button-primary" type="submit">Guardar</button></form></section><div th:if="${edicion != null}" class="management-grid section-block"><section class="panel"><h3>Restablecer contraseña</h3><form method="post" th:action="@{/operaciones/usuarios/{id}/password(id=${edicion.idUsuario})}" class="ops-form"><div class="field"><label for="passwordNueva-form3">Nueva contraseña</label><input id="passwordNueva-form3" name="passwordNueva" type="password" required minlength="8" maxlength="100" autocomplete="new-password"></div><div class="field"><label for="confirmacion-form3">Repetir contraseña</label><input id="confirmacion-form3" name="confirmacion" type="password" required minlength="8" maxlength="100" autocomplete="new-password"></div><label class="confirmation"><input type="checkbox" name="confirmado" value="true" required> Confirmo esta operación</label><button class="button button-primary" type="submit">Restablecer contraseña</button></form></section><section class="panel" th:if="${edicion.rol != 'ADMINISTRADOR' and edicion.dni != #authentication.name and edicion.estado != 'ELIMINADO'}"><h3>Estado de acceso</h3><form method="post" th:action="@{/operaciones/usuarios/{id}/estado(id=${edicion.idUsuario})}" class="ops-form"><div class="field"><label for="estado-form4">Nuevo estado</label><select id="estado-form4" name="estado"><option value="ACTIVO" th:selected="${edicion.estado == 'ACTIVO'}">Activo</option><option value="INNACTIVO" th:selected="${edicion.estado == 'INNACTIVO'}">Inactivo</option></select></div><label class="confirmation"><input type="checkbox" name="confirmado" value="true" required> Confirmo esta operación</label><button class="button button-primary" type="submit">Cambiar acceso</button></form></section></div></section></body></html>
