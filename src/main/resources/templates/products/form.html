<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Formulario de producto', 'productos', ~{::main})}">
<main>
    <section class="page-intro">
        <div><span class="section-label" th:text="${editing} ? 'Actualización del catálogo' : 'Nuevo registro'">Nuevo registro</span><h2 th:text="${editing} ? 'Editar producto' : 'Agregar producto'">Agregar producto</h2><p>Completa los datos básicos. Los cambios se mantienen en memoria mientras la aplicación esté activa.</p></div>
        <a class="button button--ghost" th:href="@{/productos}" href="/productos">Volver al catálogo</a>
    </section>
    <section class="panel form-panel">
        <form class="product-form" method="post" th:object="${productForm}" th:action="${editing} ? @{/productos/{id}(id=${productId})} : @{/productos}">
            <div class="form-grid">
                <div class="field"><label for="code">Código</label><input id="code" type="text" th:field="*{code}" th:errorclass="field-control--error" maxlength="20" placeholder="Ej. EQ-020"><small class="field-hint">Identificador único de la etiqueta.</small><p class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">Error</p></div>
                <div class="field"><label for="name">Nombre</label><input id="name" type="text" th:field="*{name}" th:errorclass="field-control--error" maxlength="80" placeholder="Nombre del producto"><p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</p></div>
                <div class="field"><label for="category">Categoría</label><input id="category" type="text" th:field="*{category}" th:errorclass="field-control--error" maxlength="50" placeholder="Ej. Equipos"><p class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Error</p></div>
                <div class="field"><label for="price">Precio referencial (S/)</label><input id="price" type="number" th:field="*{price}" th:errorclass="field-control--error" min="0" step="0.01"><p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Error</p></div>
                <div class="field"><label for="stock">Stock actual</label><input id="stock" type="number" th:field="*{stock}" th:errorclass="field-control--error" min="0" step="1"><p class="field-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">Error</p></div>
                <div class="field"><label for="minimumStock">Stock mínimo</label><input id="minimumStock" type="number" th:field="*{minimumStock}" th:errorclass="field-control--error" min="0" step="1"><p class="field-error" th:if="${#fields.hasErrors('minimumStock')}" th:errors="*{minimumStock}">Error</p></div>
                <div class="field field--full"><label for="description">Descripción</label><textarea id="description" th:field="*{description}" th:errorclass="field-control--error" maxlength="180" rows="4" placeholder="Descripción breve para identificar el producto"></textarea><p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</p></div>
            </div>
            <div class="form-actions"><a class="button button--ghost" th:href="@{/productos}" href="/productos">Cancelar</a><button class="button button--primary" type="submit" th:text="${editing} ? 'Guardar cambios' : 'Registrar producto'">Registrar producto</button></div>
        </form>
    </section>
</main>
</html>
