<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloError != null ? tituloError + ' · HerramientasD' : 'Error · HerramientasD'}">Error · HerramientasD</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#contenido">Ir al contenido</a>
<th:block th:replace="~{fragments/navegacion :: cabecera('error')}"/>
<main id="contenido" class="workspace error-workspace" th:with="codigo=${#strings.toString(codigoError != null ? codigoError : (status != null ? status : '500'))}">
    <header class="page-heading"><div><p class="eyebrow">HerramientasD / Ayuda</p><h1>Retomemos el camino.</h1></div></header>
    <section class="panel empty-state error-state" aria-labelledby="error-titulo">
        <svg class="icon error-icon" aria-hidden="true"><use href="#icon-alerta"/></svg>
        <p class="error-code" th:text="${codigo}">500</p>
        <h2 id="error-titulo" th:text="${tituloError != null ? tituloError : (codigo == '401' ? 'Inicia sesión para continuar' : (codigo == '403' ? 'No tienes acceso a esta sección' : (codigo == '404' ? 'No encontramos esta página' : 'No pudimos completar la operación')))}">No pudimos completar la operación</h2>
        <p th:text="${mensajeError != null ? mensajeError : (codigo == '401' ? 'Tu sesión no está iniciada o ha expirado. Accede con tu cuenta para continuar.' : (codigo == '403' ? 'Tu cuenta no tiene los permisos necesarios. Puedes volver a tus herramientas de trabajo.' : (codigo == '404' ? 'Revisa la dirección o vuelve al inicio para encontrar lo que buscas.' : 'Ocurrió un error inesperado. Vuelve a intentarlo en unos momentos.')))}">Vuelve a intentarlo en unos momentos.</p>
        <p class="error-route" th:if="${rutaError != null}">Ruta solicitada: <span th:text="${rutaError}"></span></p>
        <div class="error-actions">
            <a class="button button-primary" th:href="@{/}">Volver al inicio <span aria-hidden="true">→</span></a>
            <a class="button button-secondary" th:href="@{/login}" sec:authorize="isAnonymous()">Iniciar sesión</a>
            <a class="button button-secondary" th:href="@{/(vista='cuenta')}" sec:authorize="isAuthenticated()">Ir a mi cuenta</a>
        </div>
    </section>
</main>
<footer class="site-footer"><span>HerramientasD</span><span>Uso interno</span></footer>
</body>
</html>
