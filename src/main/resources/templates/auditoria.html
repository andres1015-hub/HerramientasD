<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<th:block th:fragment="contenido">
<main id="contenido" class="workspace" sec:authorize="hasRole('ADMINISTRADOR')">
<header class="page-heading"><div><p class="eyebrow">Operaciones / Auditoría de operaciones</p><h1>Auditoría de operaciones</h1><p>Consulta quién realizó cada operación y cuándo.</p></div><a class="button button-secondary" th:href="@{/}">Volver al inicio</a></header>
<section class="panel" data-module="auditoria" th:attr="data-admin=${#authorization.expression('hasRole(''ADMINISTRADOR'')')}" hidden aria-label="Auditoría de operaciones"></section>
<noscript><p class="message">Activa JavaScript para consultar y filtrar este historial.</p></noscript>
</main>
<main id="contenido" class="workspace empty-state" sec:authorize="!hasRole('ADMINISTRADOR')"><h1>Acceso restringido</h1><p>Tu cuenta no tiene permisos para esta sección.</p><a class="button button-primary" th:href="@{/}">Volver al inicio</a></main>
</th:block></body></html>
