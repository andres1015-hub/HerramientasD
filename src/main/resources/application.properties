spring.application.name=ProyectoDesarrollo

# El avance usa H2 por defecto para poder ejecutarse sin infraestructura externa.
# Docker o un entorno posterior pueden inyectar una URL PostgreSQL mediante variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:herramientasd;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.thymeleaf.cache=false
